<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Online: Nightfall</title>
    <style>
        body { margin: 0; background: #0d0d13; color: #fff; font-family: sans-serif; text-align: center; }
        .lobby { max-width: 500px; margin: auto; padding: 20px; }
        h1 { color: #ff3b30; text-shadow: 0 0 10px rgba(255,59,48,0.5); font-size: 28px; margin-bottom: 20px; }
        .stats { font-size: 16px; margin-bottom: 15px; color: #a0a0b0; }
        .stats span { color: #fff; font-weight: bold; }
        .btn { background: #34c759; color: white; border: none; padding: 14px 25px; font-size: 16px; border-radius: 12px; cursor: pointer; margin: 8px 0; width: 100%; font-weight: bold; }
        .btn-admin { background: #ff3b30; }
        .chat { background: #14141c; border-radius: 12px; height: 220px; overflow-y: auto; text-align: left; padding: 12px; margin: 15px 0; border: 1px solid #232330; font-size: 14px; }
        .admin-name { color: #ff3b30; font-weight: bold; }
        .bot-name { color: #5ac8fa; font-weight: bold; }
        .system-msg { color: #ff9500; font-weight: bold; font-size: 13px; margin: 5px 0; text-align: center; background: rgba(255,149,0,0.1); padding: 4px; border-radius: 6px; }
        .input-group { display: flex; gap: 8px; margin: 10px 0; }
        .input-field { flex: 1; background: #1c1c24; border: 1px solid #2c2c38; border-radius: 8px; padding: 10px; color: white; font-size: 14px; }
        .btn-sm { width: auto; padding: 10px 15px; background: #5856d6; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .shop-container { display: none; background: #14141c; border: 1px solid #232330; border-radius: 12px; padding: 15px; margin: 15px 0; text-align: left; }
        .shop-title { font-weight: bold; color: #ffcc00; margin-bottom: 10px; border-bottom: 1px solid #232330; padding-bottom: 5px; }
        .chest-item { display: flex; justify-content: space-between; align-items: center; background: #1c1c24; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #2c2c38; }
        .chest-name { font-weight: bold; font-size: 14px; }
        .chest-price { color: #ffcc00; font-size: 13px; font-weight: bold; }
        .btn-buy { background: #ffcc00; color: #0d0d13; border: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .drop-card { background: linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%); border: 2px solid #ffcc00; border-radius: 12px; padding: 12px; margin: 10px 0; text-align: center; box-shadow: 0 0 15px rgba(255,204,0,0.3); }
        .drop-title { font-size: 12px; color: #a0a0b0; }
        .drop-role { font-size: 20px; font-weight: bold; color: #fff; margin: 8px 0; }
        .gold-badge { background: #ffcc00; color: #0d0d13; font-weight: bold; padding: 4px 15px; border-radius: 4px; display: inline-block; font-size: 12px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="lobby">
        <h1>🎙️ MAFIA NIGHTFALL</h1>
        <div class="stats">Текущий Ранг: <span id="rank">Кадет (0 MMR)</span></div>
        <div class="stats">Баланс: <span id="coins">0</span> 🪙</div>
        
        <div class="chat" id="global-chat">
            <div><span class="admin-name">👑 Админ:</span> Добро пожаловать в Глобальный чат лобби!</div>
        </div>

        <div class="input-group">
            <input type="text" id="promo-input" class="input-field" placeholder="Введите промокод или /команду">
            <button class="btn btn-sm" onclick="handleInput()">Ввод</button>
        </div>

        <div id="chest-shop" class="shop-container">
            <div class="shop-title">📦 МАГАЗИН СУНДУКОВ И ДОНАТА</div>
            <div class="chest-item"><div><div class="chest-name">🟥 Сундук «СССР»</div><div class="chest-price">30 Монет</div></div><button class="btn-buy" onclick="buyChest('ussr', 30, 'coins')">Открыть</button></div>
            <div class="chest-item"><div><div class="chest-name">🐾 Сундук «Кошачий Синдикат»</div><div class="chest-price">60 Монет</div></div><button class="btn-buy" onclick="buyChest('cats', 60, 'coins')">Открыть</button></div>
            <div class="chest-item"><div><div class="chest-name">🤖 Кибер-Сундук</div><div class="chest-price">Донат \$1.99</div></div><button class="btn-buy" onclick="buyChest('cyber', 1.99, 'donate')">Купить</button></div>
            <div class="chest-item"><div><div class="chest-name">🎋 Сундук «Якудза»</div><div class="chest-price">Донат \$2.99</div></div><button class="btn-buy" onclick="buyChest('yakuza', 2.99, 'donate')">Купить</button></div>
            <div class="chest-item"><div><div class="chest-name">🧛‍♂️ Сундук «Вампиры»</div><div class="chest-price">Викторина</div></div><button class="btn-buy" style="background:#5856d6; color:white;" onclick="buyChest('vampire', 0, 'quiz')">Тест Дропа</button></div>
        </div>

        <button class="btn" style="background:#ff9500;" onclick="toggleShop()">🛍️ Открыть/Закрыть Магазин</button>
        <button class="btn" onclick="openInventory()">🎒 Мой Инвентарь и Роли</button>
        <button class="btn btn-admin" onclick="addBots()">🤖 Добавить ИИ-Ботов</button>
    </div>

    <script src="game.js"></script>
    <script>
        if (typeof user !== 'undefined') { updateUI(); }
        function toggleShop() {
            let shop = document.getElementById("chest-shop");
            shop.style.display = (shop.style.display === "block") ? "none" : "block";
        }
        function handleInput() {
            let inputEl = document.getElementById("promo-input");
            let val = inputEl.value.trim();
            if (!val) return;
            let chat = document.getElementById("global-chat");
            if (val.startsWith("/")) {
                let res = sendAdminCommand(val);
                chat.innerHTML += `<div><span style="color:#5856d6">⚙️ Система:</span> ${res}</div>`;
            } else {
                let res = activatePromo(val);
                chat.innerHTML += `<div><span style="color:#34c759">🎁 Бонус:</span> ${res}</div>`;
            }
            inputEl.value = "";
            chat.scrollTop = chat.scrollHeight;
            updateUI();
        }
    </script>
</body>
</html>
