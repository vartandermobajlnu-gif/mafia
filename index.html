<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Online: Nightfall</title>
    <style>
        body { margin: 0; background: #0d0d13; color: #fff; font-family: sans-serif; text-align: center; }
        .lobby { max-width: 500px; margin: auto; padding: 20px; }
        h1 { color: #ff3b30; text-shadow: 0 0 10px rgba(255,59,48,0.5); font-size: 28px; margin-bottom: 20px; }
        .stats { font-size: 16px; margin-bottom: 15px; color: #a0a0b0; }
        .stats span { color: #fff; font-weight: bold; }
        .btn { background: #34c759; color: white; border: none; padding: 14px 25px; font-size: 16px; border-radius: 12px; cursor: pointer; margin: 8px 0; width: 100%; font-weight: bold; transition: 0.2s; }
        .btn-admin { background: #ff3b30; }
        .chat { background: #14141c; border-radius: 12px; height: 180px; overflow-y: auto; text-align: left; padding: 12px; margin: 15px 0; border: 1px solid #232330; font-size: 14px; }
        .admin-name { color: #ff3b30; font-weight: bold; }
        .input-group { display: flex; gap: 8px; margin: 10px 0; }
        .input-field { flex: 1; background: #1c1c24; border: 1px solid #2c2c38; border-radius: 8px; padding: 10px; color: white; font-size: 14px; }
        .btn-sm { width: auto; padding: 10px 15px; margin: 0; font-size: 14px; background: #5856d6; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="lobby">
        <h1>🎙️ MAFIA NIGHTFALL</h1>
        <div class="stats">Текущий Ранг: <span id="rank">Кадет (0 MMR)</span></div>
        <div class="stats">Баланс: <span id="coins">0</span> 🪙</div>
        
        <div class="chat" id="global-chat">
            <div><span class="admin-name">👑 Админ:</span> Добро пожаловать в Глобальный чат лобби! Скоро начнется викторина на Вампирский сундук!</div>
        </div>

        <!-- Поле для промокодов и админ-команд -->
        <div class="input-group">
            <input type="text" id="promo-input" class="input-field" placeholder="Введите промокод или /команду">
            <button class="btn btn-sm" onclick="handleInput()">Ввод</button>
        </div>

        <button class="btn" onclick="openShop()">🛍️ Магазин Шапок и Сундуков</button>
        <button class="btn" onclick="openInventory()">🎒 Мой Инвентарь и Роли</button>
        <button class="btn btn-admin" onclick="addBots()">🤖 Добавить ИИ-Ботов</button>
    </div>

    <!-- ПОДКЛЮЧАЕМ НАШ ДВИЖОК ИЗ GAME.JS -->
    <script src="game.js"></script>
    <script>
        // Инициализация при старте страницы
        if (typeof user !== 'undefined') {
            updateUI();
        }

        function handleInput() {
            let inputEl = document.getElementById("promo-input");
            let val = inputEl.value.trim();
            if (!val) return;

            let chat = document.getElementById("global-chat");
            
            // Если это админ-команда
            if (val.startsWith("/")) {
                let res = sendAdminCommand(val);
                chat.innerHTML += `<div><span style="color:#5856d6">⚙️ Система:</span> ${res}</div>`;
            } else {
                // Если это промокод
                let res = activatePromo(val);
                chat.innerHTML += `<div><span style="color:#34c759">🎁 Бонус:</span> ${res}</div>`;
            }
            
            inputEl.value = "";
            chat.scrollTop = chat.scrollHeight;
        }

        function openShop() { alert("Магазин открыт! СССР: 30 монет, Коты: 60 монет, Якудза: \$2.99, Кибер: \$1.99, Вампиры (Викторина)"); }
        function openInventory() { alert(`Ваш инвентарь:\nСкины: ${user.owned_skins.join(', ')}\nШапки: ${user.owned_hats.join(', ')}`); }
        function addBots() { 
            let res = simulateMatchWithBots();
            alert(res);
            user.mmr += 15; // Даем тестовые очки за победу с ботами
            user.balance += 10;
            if (user.mmr > 200) user.rank = "Детектив";
            updateUI();
        }
    </script>
</body>
</html>
